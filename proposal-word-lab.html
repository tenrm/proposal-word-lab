<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proposal Word Lab</title>
<meta name="description" content="Interactive MS Word lab for writing a research proposal (Windows / Mac, Thai / English)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Sarabun:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}
/* Layout: sticky toolbar on top, one view at a time below; document panes look like A4 sheets on a desk, with cm rulers. */
:root{
  --desk:#EEF1F5; --paper:#FFFFFF; --ink:#16233B; --muted:#5A667A; --line:#D6DCE5; --line2:#E7EBF1;
  --accent:#1E5BB8; --accent-ink:#FFFFFF; --accent-soft:#E3ECFA;
  --mark:#FFE873; --mark-ink:#16233B; --ok:#1C7C50; --ok-soft:#DFF3E8; --warn:#B4520F; --warn-soft:#FCEBDD;
  --ins:#1D5FC2; --del:#C0392B; --field:#E3E6EB; --chip:#F4F6F9;
  --shadow:0 1px 2px rgba(22,35,59,.08),0 6px 20px rgba(22,35,59,.06);
  --f-display:"Bai Jamjuree","Sarabun","Leelawadee UI","Thonburi",system-ui,sans-serif;
  --f-body:"Sarabun","Leelawadee UI","Thonburi","Tahoma",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0E131C; --paper:#161D29; --ink:#E5EAF2; --muted:#9AA6B9; --line:#2A3445; --line2:#222B3A;
  --accent:#6FA6FF; --accent-ink:#0B1220; --accent-soft:#1B2A44;
  --mark:#7A6410; --mark-ink:#FFF6CC; --ok:#5FD39A; --ok-soft:#14301F; --warn:#F2A15E; --warn-soft:#3A2414;
  --ins:#7FB0FF; --del:#FF8A7D; --field:#2A3240; --chip:#1D2533;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#0E131C; --paper:#161D29; --ink:#E5EAF2; --muted:#9AA6B9; --line:#2A3445; --line2:#222B3A;
  --accent:#6FA6FF; --accent-ink:#0B1220; --accent-soft:#1B2A44;
  --mark:#7A6410; --mark-ink:#FFF6CC; --ok:#5FD39A; --ok-soft:#14301F; --warn:#F2A15E; --warn-soft:#3A2414;
  --ins:#7FB0FF; --del:#FF8A7D; --field:#2A3240; --chip:#1D2533;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:.875rem}
kbd,.kbd{font-family:var(--f-mono);font-size:.78rem;font-weight:600;display:inline-block;padding:.05em .45em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--paper);color:var(--ink);white-space:nowrap;line-height:1.5}
.keys{display:inline-flex;flex-wrap:wrap;gap:.25rem;align-items:center}
.keys .plus{color:var(--muted);font-size:.75rem}
.keys .or{color:var(--muted);font-size:.8rem;margin:0 .2rem}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .mark{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 22px/1 var(--f-display);flex:none}
.brand b{font-family:var(--f-display);font-size:1.05rem;display:block;line-height:1.2}
.brand span{font-size:.8rem;color:var(--muted);display:block;line-height:1.3}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--chip)}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toggles{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggles label{font-size:.75rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
nav.tabs{border-top:1px solid var(--line2)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;padding-block:0;scrollbar-width:thin}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:9px 12px;font-weight:600;font-size:.92rem;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-block:24px 48px}
.view{display:grid;gap:22px}
.head{display:grid;gap:6px;max-width:760px}
.head h2{font-size:clamp(1.4rem,3vw,1.9rem)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.task{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.95rem}
.task b{font-family:var(--f-display)}
.note{font-size:.88rem;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
input[type=range]{accent-color:var(--accent)}

/* start view */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
.hero .kick{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.hero h1{font-size:clamp(1.7rem,4.2vw,2.7rem);margin:.3rem 0 .7rem}
.hero .lead{font-size:1.05rem;max-width:60ch}
.hero .src{font-size:.82rem;color:var(--muted);margin-top:.8rem;max-width:62ch}
.sheet{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:4px;aspect-ratio:210/297;max-width:100%;padding:12% 10% 9% 14%;position:relative;font-size:.62rem;line-height:1.5;overflow:hidden}
.sheet .ln{height:.42em;background:var(--line2);border-radius:2px;margin:.55em 0}
.sheet .h{font:700 1.05em var(--f-display);color:var(--ink);margin:.9em 0 .4em;display:flex;gap:.6em;align-items:baseline}
.sheet .h i{font-style:normal;color:var(--accent)}
.sheet .pil{position:absolute;right:6%;color:var(--accent);font-size:1.2em;opacity:.8}
.sheet .marg{position:absolute;inset:0;pointer-events:none;border:1px dashed var(--line);margin:12% 10% 9% 14%}
.sheet .tag{position:absolute;font:600 .9em var(--f-mono);color:var(--muted);background:var(--paper);padding:0 3px}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;counter-reset:f}
.flow button{counter-increment:f;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;display:grid;gap:2px;position:relative}
.flow button::before{content:counter(f,decimal-leading-zero);font:600 .75rem var(--f-mono);color:var(--accent)}
.flow button b{font-family:var(--f-display);font-size:1rem}
.flow button span{font-size:.85rem;color:var(--muted)}
.flow button:hover{border-color:var(--accent)}

/* ribbon */
.ribbon{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.rtabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--chip);padding:0 6px}
.rtabs button{border:0;background:none;padding:9px 14px;font-weight:600;font-size:.92rem;color:var(--muted);border-bottom:3px solid transparent;flex:none}
.rtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--paper)}
.rtabs button.file{color:var(--accent)}
.rbody{display:flex;gap:0;overflow-x:auto;padding:10px 6px 0}
.rgroup{display:flex;flex-direction:column;border-right:1px solid var(--line2);padding:0 8px;flex:none}
.rgroup:last-child{border-right:0}
.rgroup .btns{display:flex;gap:4px;flex:1}
.rgroup .gl{font-size:.72rem;color:var(--muted);text-align:center;padding:4px 0 6px}
.rbtn{border:1px solid transparent;background:none;border-radius:6px;padding:6px 6px 4px;width:88px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.74rem;line-height:1.25;text-align:center;color:var(--ink)}
.rbtn .ic{width:34px;height:30px;display:grid;place-items:center;font:700 .95rem var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:6px}
.rbtn:hover{border-color:var(--line)}
.rbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rbtn.hit{outline:2px solid var(--mark);outline-offset:1px}
.rsearch{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line2);background:var(--chip)}
.rsearch input{flex:1;min-width:0}
.results{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px;background:var(--chip)}
.results button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:.82rem}
.detail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.detail h3{font-size:1.35rem;display:flex;gap:10px;align-items:center}
.detail h3 .ic{font:700 1rem var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px}
.detail .path{font-family:var(--f-body);background:var(--chip);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin-top:6px}
.detail .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:12px}
.detail .tip{background:var(--mark);color:var(--mark-ink);border-radius:8px;padding:10px 12px}
.oscmp{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:.88rem;margin-top:6px}
.oscmp .os{font-weight:700;font-size:.75rem;color:var(--muted)}
.oscmp .cur{color:var(--accent)}

/* labs */
.labnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.labnav button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px}
.labnav button .ic{flex:none;width:34px;height:34px;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 .9rem var(--f-mono)}
.labnav button b{display:block;font-family:var(--f-display);font-size:.95rem;line-height:1.3}
.labnav button span{font-size:.8rem;color:var(--muted);line-height:1.35;display:block}
.labnav button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.labnav .okdot{margin-left:auto;color:var(--ok);font-weight:700}
.lab{display:grid;gap:14px}
.labhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.labhead h3{font-size:1.3rem}
.split{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:14px}
.split.r{grid-template-columns:minmax(0,1fr) minmax(0,280px)}
.doc{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:28px 34px 28px 44px;min-height:200px;font-family:var(--f-body);font-size:1.02rem;line-height:1.55;min-width:0}
.doc:focus{outline:2px solid var(--accent-soft)}
.side{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;font-size:.92rem}
.side h4{font:700 .78rem var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px}
.toolbar .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.stylebtn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 10px;display:grid;line-height:1.2;text-align:left;min-width:92px}
.stylebtn b{font-family:var(--f-display);font-size:.9rem}
.stylebtn small{font:500 .66rem var(--f-mono);color:var(--muted)}
.stylebtn.on{border-color:var(--accent);background:var(--accent-soft)}

/* styles lab */
.p{padding:3px 8px;margin:1px -8px;border-radius:4px;cursor:pointer;border-left:3px solid transparent}
.p.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.p.normal{font-size:1rem}
.p.fake{font-weight:700;font-size:1.08rem}
.p.h1{font:700 1.3rem var(--f-display);margin-top:12px;color:var(--ink)}
.p.h2{font:700 1.1rem var(--f-display);margin-top:6px}
.p.h3{font:600 1.02rem var(--f-display);font-style:italic}
.p .num{color:var(--accent);margin-right:.5em;font-style:normal}
.p .tagS{float:right;font:500 .64rem var(--f-mono);color:var(--muted);margin-top:.4em}
.toc{border:1px dashed var(--line);border-radius:4px;padding:10px 12px;margin-bottom:14px;background:var(--chip)}
.toc.stale{border-color:var(--warn)}
.toc .t{font:700 1rem var(--f-display);margin-bottom:4px}
.toc .e{display:flex;gap:6px;font-size:.92rem}
.toc .e .dots{flex:1;border-bottom:1px dotted var(--muted);margin-bottom:.45em}
.toc .e.l2{padding-left:1.2em}.toc .e.l3{padding-left:2.4em}
.nav .ni{display:flex;gap:4px;align-items:center;padding:3px 4px;border-radius:5px;cursor:pointer;font-size:.88rem}
.nav .ni:hover{background:var(--chip)}
.nav .ni.sel{background:var(--accent-soft)}
.nav .ni.l2{padding-left:16px}.nav .ni.l3{padding-left:28px}
.nav .ni span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .mv{border:0;background:none;color:var(--muted);padding:0 3px;font-size:.8rem}
.nav .empty{color:var(--muted);font-size:.85rem}

/* captions lab */
.blk{border:1px solid transparent;border-radius:6px;padding:8px;margin:4px -8px;cursor:pointer}
.blk.sel{border-color:var(--accent);background:var(--accent-soft)}
.fig{display:grid;justify-items:center;gap:6px}
.figbox{width:min(260px,100%);aspect-ratio:16/8;border-radius:4px;background:linear-gradient(160deg,var(--accent-soft),var(--line2));display:grid;place-items:center;color:var(--muted);font:600 .8rem var(--f-mono);border:1px solid var(--line)}
.cap{font-size:.95rem;text-align:center}
.cap b{font-weight:700}
.fld{background:var(--field);border-radius:2px;padding:0 2px}
.fld.stale{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 -2px 0 var(--warn)}
.fld.err{background:var(--warn-soft);color:var(--del);font-weight:700}
.code{font-family:var(--f-mono);font-size:.82em}
table.mini{border-collapse:collapse;margin:4px auto;font-size:.85rem}
table.mini td,table.mini th{border:1px solid var(--line);padding:2px 10px}
table.mini th{background:var(--chip)}

/* marks lab */
.mk{color:var(--accent);opacity:.75;font-family:var(--f-mono);font-size:.8em}
.mk.sp{opacity:.6}
.tabc{display:inline-block;width:2.2em}
.pbreak{display:block;text-align:center;color:var(--muted);font:600 .72rem var(--f-mono);border-top:1px dashed var(--muted);margin:8px 0;padding-top:2px}
.hl{background:var(--mark);color:var(--mark-ink);border-radius:2px}
.frbox{display:grid;gap:8px}
.frbox label{font-size:.8rem;color:var(--muted);display:grid;gap:2px}
.chal{display:grid;gap:6px;font-size:.88rem}
.chal div{display:flex;gap:8px;align-items:flex-start}
.chal .ck{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;font-weight:700}
.chal .ck.ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.specials{display:flex;gap:4px;flex-wrap:wrap}
.specials button{font:600 .75rem var(--f-mono);border:1px solid var(--line);background:var(--chip);border-radius:5px;padding:1px 6px}

/* ruler */
.ruler{position:relative;height:30px;background:var(--paper);border:1px solid var(--line);border-radius:4px;user-select:none;touch-action:none;overflow:hidden}
.ruler .tk{position:absolute;bottom:0;width:1px;background:var(--muted)}
.ruler .nm{position:absolute;top:1px;font:500 .62rem var(--f-mono);color:var(--muted);transform:translateX(-50%)}
.ruler .mkr{position:absolute;transform:translateX(-50%);color:var(--accent);font-size:.8rem;line-height:1;cursor:grab}
.ruler .tab{position:absolute;bottom:2px;transform:translateX(-50%);font:700 .9rem var(--f-mono);color:var(--ink);cursor:grab;padding:0 3px}
.ruler .tab.sel{color:var(--accent)}
.rulerwrap{display:flex;gap:6px;align-items:stretch}
.tabsel{width:34px;flex:none;border:1px solid var(--line);border-radius:4px;background:var(--chip);font:700 1rem var(--f-mono)}
.refs p{margin:0 0 .45em;font-size:1rem}
.refs.hard p{white-space:pre}
.ctl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:.9rem}
.ctl output{font:600 .82rem var(--f-mono);min-width:4.5em;text-align:right}
.tabdoc .line{position:relative;height:1.75em;white-space:nowrap}
.tabdoc .tseg{position:absolute;top:0}
.tabdoc .leader{position:absolute;top:0;overflow:hidden;color:var(--muted);letter-spacing:.15em}
.tabdoc .b{font-weight:700}
.guide{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--accent);opacity:.5;pointer-events:none}

/* table lab */
.pages{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pg{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:3px;padding:18px 16px 8px;min-width:0;overflow-x:auto}
.pg .pn{font:500 .7rem var(--f-mono);color:var(--muted);text-align:center;margin-top:6px}
table.sched{border-collapse:collapse;width:100%;font-size:.8rem;table-layout:fixed}
table.sched th,table.sched td{border:1px solid var(--line);vertical-align:top}
table.sched th{background:var(--accent-soft);font-weight:700}
table.sched .cell{display:block}
table.sched tr.rep th{background:var(--mark);color:var(--mark-ink)}

/* sections lab */
.spread{display:flex;flex-wrap:wrap;gap:0;align-items:stretch}
.thumb{width:92px;aspect-ratio:210/297;background:var(--paper);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;padding:8px 6px 5px;font-size:.66rem;line-height:1.25;cursor:pointer;position:relative}
.thumb .tt{font-weight:700;font-family:var(--f-display)}
.thumb .ft{text-align:center;font:600 .78rem var(--f-mono);border-top:1px dashed var(--line2);padding-top:2px;min-height:1.4em}
.thumb .sx{position:absolute;top:-9px;left:6px;font:700 .6rem var(--f-mono);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.thumb.selsec{outline:2px solid var(--accent);outline-offset:1px}
.thumb.s0{background:var(--paper)}
.gap{width:26px;display:grid;place-items:center;align-self:stretch;margin:0 2px;border:0;background:none;padding:0}
.gap span{writing-mode:vertical-rl;font:700 .58rem var(--f-mono);color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:6px 1px;background:var(--chip)}
.gap.on span{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.secset{display:grid;gap:10px}
.secset .row label{font-size:.9rem}

/* track lab */
.ins{color:var(--ins);text-decoration:underline;text-decoration-thickness:2px;cursor:pointer}
.del{color:var(--del);text-decoration:line-through;cursor:pointer}
.ins.cur,.del.cur{background:var(--mark);color:var(--mark-ink)}
.chbar{border-left:3px solid var(--del);padding-left:10px}
.balloons{display:grid;gap:8px}
.balloon{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 10px;font-size:.85rem;background:var(--paper)}
.balloon.res{opacity:.55}
.balloon b{font-family:var(--f-display)}
textarea{width:100%;min-height:96px;resize:vertical}

/* keys */
.trainer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:14px}
.pad{background:var(--paper);border:2px dashed var(--line);border-radius:12px;padding:24px;display:grid;gap:12px;justify-items:center;text-align:center;min-height:220px;align-content:center}
.pad:focus{border-color:var(--accent);border-style:solid;outline:0}
.pad .prompt{font:700 clamp(1.2rem,3vw,1.7rem) var(--f-display)}
.pad .pressed{min-height:2rem}
.pad.good{border-color:var(--ok);background:var(--ok-soft)}
.pad.bad{border-color:var(--warn)}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.score div{background:var(--chip);border-radius:8px;padding:8px}
.score b{display:block;font:700 1.4rem var(--f-display);font-variant-numeric:tabular-nums}
.score span{font-size:.75rem;color:var(--muted)}
.tblwrap{overflow-x:auto}
table.keys{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
table.keys th,table.keys td{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:middle}
table.keys th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.keys td.cur{background:var(--accent-soft)}
table.keys tr.cat td{font:700 .78rem var(--f-display);color:var(--accent);padding-top:14px;text-transform:uppercase;letter-spacing:.05em}

/* setup */
.setlist{display:grid;gap:10px}
.setitem{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px}
.setitem b{font-family:var(--f-display)}
.setitem .src{font-size:.7rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.setitem .p2{background:var(--chip);border-radius:7px;padding:8px 10px;font-size:.9rem}
.ios{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ios ul{margin:6px 0 0;padding-left:1.2em}

/* quiz */
.qcard{display:grid;gap:10px}
.qopts{display:grid;gap:6px}
.qopts button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px}
.qopts button.right{border-color:var(--ok);background:var(--ok-soft)}
.qopts button.wrong{border-color:var(--del);background:var(--warn-soft)}
.prog{height:6px;background:var(--line2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}

/* checklist */
.clist{display:grid;gap:6px}
.clist label{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.clist input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok);flex:none}
.clist label.on{border-color:var(--ok)}
.reslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.reslist a{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.reslist a b{color:var(--accent);font-family:var(--f-display)}
.reslist a span{display:block;font-size:.85rem;color:var(--muted)}
footer{padding-block:20px 40px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);margin-top:20px}

@media (max-width:860px){
  .hero,.detail,.split,.split.r,.trainer,.setitem,.ios{grid-template-columns:minmax(0,1fr)}
  .hero .sheetbox{max-width:260px}
  .doc{padding:20px 18px 20px 22px}
}
@media (prefers-reduced-motion:no-preference){
  .pad,.btn,.rbtn{transition:background-color .15s,border-color .15s}
}
.refs p.ref{font-size:var(--fs,16px);padding-left:var(--pl,0);text-indent:var(--ti,0);overflow-wrap:anywhere}
table.sched th,table.sched td{padding:2px var(--pad,.19cm)}
table.sched .cell{margin-left:var(--ind,0)}
.toggles .tl{font-size:.75rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.btn{text-decoration:none}
.hero .sheetbox{max-width:330px;width:100%;justify-self:center}
.sheet{font-size:.7rem}

</style>

/* ---------- keys ---------- */
const KEYNAME = { Cmd: '⌘ Cmd', Opt: '⌥ Option', Shift: '⇧ Shift', Left: '←', Right: '→', Up: '↑', Down: '↓' };
function dispKey(k, os) { if (os === 'mac' && k === 'Ctrl') return '⌃ Control'; if (os === 'mac' && k === 'Enter') return 'Return'; return KEYNAME[k] || k; }
function keysHTML(str, os = S.os) {
  if (!str) return '';
  return '<span class="keys">' + str.split(' / ').map(c => c.split('+').map(k => '<kbd>' + esc(dispKey(k, os)) + '</kbd>').join('<span class="plus">+</span>')).join('<span class="or">/</span>') + '</span>';
}
function keyCode(k) {
  if (/^[A-Z]$/.test(k)) return 'Key' + k;
  if (/^[0-9]$/.test(k)) return 'Digit' + k;
  if (/^F\d+$/.test(k)) return k;
  return ({ Enter: 'Enter', Return: 'Enter', Space: 'Space', ']': 'BracketRight', '[': 'BracketLeft', '=': 'Equal', '-': 'Minus', ',': 'Comma', Left: 'ArrowLeft', Right: 'ArrowRight', Up: 'ArrowUp', Down: 'ArrowDown' })[k] || k;
}
const MODMAP = { Cmd: 'meta', Opt: 'alt', Alt: 'alt', Ctrl: 'ctrl', Shift: 'shift', Win: 'meta' };
function parseCombo(s) { const parts = s.split('+'); const key = parts.pop(); return { mods: parts.map(m => MODMAP[m]).sort().join(','), code: keyCode(key) }; }
function eventCombo(e) {
  const m = []; if (e.altKey) m.push('alt'); if (e.ctrlKey) m.push('ctrl'); if (e.metaKey) m.push('meta'); if (e.shiftKey) m.push('shift');
  return { mods: m.sort().join(','), code: e.code === 'NumpadEnter' ? 'Enter' : e.code };
}
function matches(e, str) { if (!str) return false; const ec = eventCombo(e); return str.split(' / ').some(s => { const c = parseCombo(s); return c.mods === ec.mods && c.code === ec.code; }); }
function isModOnly(e) { return /^(Shift|Control|Alt|Meta|OS|CapsLock)/.test(e.code) || ['Shift', 'Control', 'Alt', 'Meta'].includes(e.key); }
function pressedLabel(e) {
  const os = S.os; const parts = [];
  if (e.ctrlKey) parts.push(os === 'mac' ? '⌃ Control' : 'Ctrl');
  if (e.metaKey) parts.push(os === 'mac' ? '⌘ Cmd' : 'Win');
  if (e.altKey) parts.push(os === 'mac' ? '⌥ Option' : 'Alt');
  if (e.shiftKey) parts.push('⇧ Shift');
  let k = e.code.replace(/^Key/, '').replace(/^Digit/, '').replace(/^Arrow/, '');
  k = ({ BracketLeft: '[', BracketRight: ']', Equal: '=', Minus: '-', Comma: ',', Space: 'Space', Enter: os === 'mac' ? 'Return' : 'Enter', NumpadEnter: 'Enter' })[k] || k;
  parts.push(k);
  return '<span class="keys">' + parts.map(p => '<kbd>' + esc(p) + '</kbd>').join('<span class="plus">+</span>') + '</span>';
}
const K = (win, mac) => (S.os === 'mac' ? mac : win);

  if (!VIEWS.includes(v)) v = 'start';

  const resolve = (g, accept) => { g.idx.forEach(k => { const x = tk.toks[k]; if (x.type === 'ins') x.type = accept ? 'eq' : 'x'; else if (x.type === 'del') x.type = accept ? 'x' : 'eq'; }); };
  if (a === 'track') tk.track = !tk.track;
  else if (a === 'next' || a === 'prev') { if (chIdx.length) { const pos = chIdx.indexOf(tk.cur); tk.cur = a === 'next' ? chIdx[(pos + 1) % chIdx.length] : chIdx[(pos - 1 + chIdx.length) % chIdx.length]; } }
  else if ((a === 'acc' || a === 'rej') && G[tk.cur]) { resolve(G[tk.cur], a === 'acc'); tk.touched = true; }
  else if (a === 'accall' || a === 'rejall') { G.forEach(g => resolve(g, a === 'accall')); tk.touched = true; }
  else if (a === 'com') { const v = ($('#tkCom').value || '').trim(); if (v) tk.comments.push({ who: TT('นิสิต', 'Student'), text: v, res: false }); }
  tk.toks = tk.toks.filter(x => x.type !== 'x');
  if (a === 'acc' || a === 'rej') { const nG = tkGroups(); const nxt = nG.findIndex(g => g.type !== 'eq'); tk.cur = nxt; }
  if (a === 'accall' || a === 'rejall') tk.cur = -1;
  rerenderLab();
}

/* ---------- keys view ---------- */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function ktPool() { return shuffle(KEYS.filter(k => k[S.os] && !(k.nd && k.nd[S.os]))); }
S.kt = { os: null, pool: [], i: 0, ok: 0, tries: 0, streak: 0, state: '', pressed: '', reveal: false, filter: '' };
function renderKeys() {
  const kt = S.kt; if (kt.os !== S.os) { kt.os = S.os; kt.pool = ktPool(); kt.i = 0; kt.state = ''; kt.pressed = ''; kt.reveal = false; }
  const cur = kt.pool[kt.i % kt.pool.length];
  const f = kt.filter.trim().toLowerCase();
  const rows = []; Object.keys(KEYCAT).forEach(c => {
    const items = KEYS.filter(k => k.c === c && (!f || (k.n[0] + ' ' + k.n[1] + ' ' + k.win + ' ' + k.mac).toLowerCase().includes(f)));
    if (!items.length) return;
    rows.push(`<tr class="cat"><td colspan="3">${esc(tr(KEYCAT[c]))}</td></tr>`);
    items.forEach(k => rows.push(`<tr><td>${esc(tr(k.n))}</td><td class="${S.os === 'win' ? 'cur' : ''}">${k.win ? keysHTML(k.win, 'win') : '<span class="muted">—</span>'}</td><td class="${S.os === 'mac' ? 'cur' : ''}">${k.mac ? keysHTML(k.mac, 'mac') : '<span class="muted">—</span>'}</td></tr>`));
  });
  keepFocus('ktPad', () => {
    $('#v-keys').innerHTML = `
    <div class="head"><h2>${esc(t('keysTitle'))} · ${OSN[S.os]}</h2><p class="muted">${esc(t('keysLead'))}</p></div>
    <div class="trainer">
      <div class="pad ${kt.state}" id="ktPad" tabindex="0" aria-live="polite">
        <span class="small muted">${esc(tr(KEYCAT[cur.c]))} · ${kt.i % kt.pool.length + 1}/${kt.pool.length}</span>
        <div class="prompt">${esc(tr(cur.n))}</div>
        <div class="pressed">${kt.pressed || `<span class="muted small">${TT('คลิกกรอบนี้แล้วกดแป้น', 'Click here, then press the keys')}</span>`}</div>
        <div class="small" style="min-height:1.6em">${kt.state === 'good' ? `<b style="color:var(--ok)">✓ ${TT('ถูกต้อง', 'Correct')}</b>` : kt.state === 'bad' ? `<b style="color:var(--warn)">${TT('ยังไม่ใช่ ลองอีกครั้ง', 'Not that one, try again')}</b>` : ''}
          ${kt.reveal || kt.state === 'good' ? `<div style="margin-top:4px">${keysHTML(cur[S.os])}</div>` : ''}</div>
        <div class="row"><button type="button" class="btn" data-kt="reveal">${TT('ดูเฉลย', 'Show answer')}</button><button type="button" class="btn" data-kt="skip">${TT('ข้าม', 'Skip')} →</button></div>
      </div>
      <div style="display:grid;gap:10px;align-content:start">
        <div class="score"><div><b>${kt.ok}</b><span>${TT('ถูก', 'Correct')}</span></div><div><b>${kt.tries}</b><span>${TT('ครั้งที่กด', 'Attempts')}</span></div><div><b>${kt.streak}</b><span>${TT('ติดต่อกัน', 'Streak')}</span></div></div>
        <p class="note">${TT('แป้นที่เบราว์เซอร์ยึดไว้ (เช่น ' + K('Ctrl+N, Ctrl+T, F12', 'Cmd+N, Cmd+T') + ') ไม่อยู่ในโหมดฝึก แต่มีในตารางด้านล่าง', 'Keys the browser keeps for itself (like ' + K('Ctrl+N, Ctrl+T, F12', 'Cmd+N, Cmd+T') + ') are left out of the drill but listed in the table below.')}</p>
        ${S.os === 'mac' ? `<p class="note">${TT('Mac โน้ตบุ๊ก: ปุ่ม F1–F12 อาจต้องกด Fn ร่วมด้วย · ⌥ Option คือปุ่ม Alt บนคีย์บอร์ด Windows ที่ต่อกับ Mac', 'Mac laptops: F1–F12 may need Fn · ⌥ Option is the Alt key on a Windows keyboard plugged into a Mac')}</p>` : `<p class="note">${TT('ใช้แป้นตัวเลขแถวบน (ไม่ใช่ Numpad) สำหรับ Ctrl+Alt+1 และ Ctrl+Shift+8', 'Use the top-row digits (not the numpad) for Ctrl+Alt+1 and Ctrl+Shift+8')}</p>`}
      </div>
    </div>
    <div class="panel" style="display:grid;gap:10px">
      <div class="row" style="justify-content:space-between"><h3>${esc(t('sheetTitle'))}</h3><input type="text" id="ktFilter" placeholder="${esc(t('sheetFilter'))}" value="${esc(kt.filter)}" aria-label="${esc(t('sheetFilter'))}"></div>
      <div class="tblwrap"><table class="keys"><thead><tr><th>${TT('คำสั่ง', 'Action')}</th><th>Windows</th><th>Mac</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
      <p class="note">${TT('ที่มา: Microsoft Support — Keyboard shortcuts in Word (Windows และ macOS) · Ctrl+Shift+C ในเอกสารประกอบเป็นแป้นรุ่นเก่าที่ยังใช้ได้ใน Windows', 'Source: Microsoft Support — Keyboard shortcuts in Word (Windows and macOS) · Ctrl+Shift+C from the handout is the older key that still works on Windows')}</p>
    </div>`;
  });
}
function ktKey(e) {
  if (isModOnly(e)) return;
  if (e.key === 'Tab' && !e.ctrlKey && !e.metaKey && !e.altKey) return;
  e.preventDefault(); const kt = S.kt; if (kt.state === 'good') return;
  const cur = kt.pool[kt.i % kt.pool.length]; kt.tries++; kt.pressed = pressedLabel(e);
  if (matches(e, cur[S.os])) { kt.ok++; kt.streak++; kt.state = 'good'; renderKeys(); setTimeout(() => { kt.i++; kt.state = ''; kt.pressed = ''; kt.reveal = false; if (S.view === 'keys') renderKeys(); }, 900); }
  else { kt.streak = 0; kt.state = 'bad'; renderKeys(); }
}

/* ---------- setup ---------- */
function renderSetup() {
  const other = S.os === 'win' ? 'mac' : 'win';
  $('#v-setup').innerHTML = `
  <div class="head"><h2>${esc(t('setupTitle'))}</h2><p class="muted">${esc(t('setupLead'))}</p></div>
  <div class="setlist">${SETUP.map(s => `<div class="setitem"><div><b>${esc(tr(s.n))}</b>${s.from ? `<span class="src">${TT('จากเอกสาร', 'Handout')}</span>` : ''}<p class="small muted" style="margin-top:4px">${esc(tr(s.why))}</p></div>
    <div style="display:grid;gap:6px;min-width:0"><div class="p2"><span class="small" style="font-weight:700;color:var(--accent)">${OSN[S.os]}</span><br>${esc(tr(s[S.os]))}</div><div class="small muted">${OSN[other]}: ${esc(tr(s[other]))}</div></div></div>`).join('')}</div>
  <div class="panel" style="display:grid;gap:12px">
    <h3>${esc(t('iosTitle'))}</h3>
    <div class="ios"><div><b style="color:var(--ok)">${TT('ทำได้', 'Works well')}</b><ul>${IOS.can.map(x => `<li>${esc(tr(x))}</li>`).join('')}</ul></div>
    <div><b style="color:var(--warn)">${TT('ทำได้จำกัด', 'Limited')}</b><ul>${IOS.cant.map(x => `<li>${esc(tr(x))}</li>`).join('')}</ul></div></div>
    <p class="note">${esc(tr(IOS.note))}</p>
  </div>`;
}

/* ---------- quiz ---------- */
S.qz = { i: 0, ans: [] };
function renderQuiz() {
  const qz = S.qz; const n = QUIZ.length;
  let body;
  if (qz.i >= n) {
    const score = qz.ans.filter((a, i) => a === QUIZ[i].a).length;
    body = `<div class="qcard"><h3>${TT('คะแนน', 'Score')}: ${score}/${n}</h3><p>${score >= 8 ? TT('พร้อมจัดรูปแบบ proposal แล้ว', 'You’re ready to format your proposal.') : TT('ลองกลับไปที่ห้องทดลองของข้อที่ผิด แล้วทำใหม่', 'Revisit the labs for the ones you missed, then try again.')}</p>
      <div class="row"><button type="button" class="btn primary" data-qz="restart">${TT('ทำใหม่', 'Try again')}</button></div></div>`;
  } else {
    const q = QUIZ[qz.i]; const a = qz.ans[qz.i];
    body = `<div class="qcard"><div class="prog"><i style="width:${(qz.i / n) * 100}%"></i></div><span class="small muted">${qz.i + 1}/${n}</span>
      <h3>${esc(tr(q.q))}</h3>
      <div class="qopts">${q.o.map((o, i) => `<button type="button" data-qa="${i}" ${a != null ? 'disabled' : ''} class="${a != null ? (i === q.a ? 'right' : i === a ? 'wrong' : '') : ''}">${esc(tr(o))}</button>`).join('')}</div>
      ${a != null ? `<p class="${a === q.a ? '' : ''}"><b>${a === q.a ? TT('ถูกต้อง', 'Correct') : TT('ยังไม่ใช่', 'Not quite')}.</b> ${esc(tr(q.e))}</p><div class="row"><button type="button" class="btn primary" data-qz="next">${TT('ข้อต่อไป', 'Next')} →</button></div>` : ''}</div>`;
  }
  $('#v-quiz').innerHTML = `<div class="head"><h2>${esc(t('quizTitle'))}</h2><p class="muted">${esc(t('quizLead'))}</p></div><div class="panel">${body}</div>`;
}

/* ---------- checklist ---------- */
function renderCheck() {
  const st = store.get('check', []); const done = CHECK.filter((c, i) => st[i]).length;
  $('#v-check').innerHTML = `
  <div class="head"><h2>${esc(t('checkTitle'))}</h2><p class="muted">${esc(t('checkLead'))}</p></div>
  <div class="panel" style="display:grid;gap:10px">
    <div class="row" style="justify-content:space-between"><b style="font-family:var(--f-display)">${done}/${CHECK.length}</b><button type="button" class="btn" data-ck="reset">${esc(t('reset'))}</button></div>
    <div class="prog"><i style="width:${(done / CHECK.length) * 100}%;background:var(--ok)"></i></div>
    <div class="clist">${CHECK.map((c, i) => `<label class="${st[i] ? 'on' : ''}"><input type="checkbox" data-ci="${i}" ${st[i] ? 'checked' : ''}><span>${esc(tr(c))}</span></label>`).join('')}</div>
  </div>
  <div style="display:grid;gap:10px"><h3>${esc(t('resTitle'))}</h3>
  <div class="reslist">${RESOURCES.map(r => `<a href="${esc(r.u)}" target="_blank" rel="noopener"><b>${esc(r.n)}</b><span>${esc(tr(r.d))}</span></a>`).join('')}</div></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('button,[data-sel],[data-cb],[data-ch],[data-pg]'); if (!el) return;
  const d = el.dataset;
  if (d.os) { S.os = d.os; store.set('os', S.os); applyChrome(); renderView(S.view); return; }
  if (d.lang) { S.lang = d.lang; store.set('lang', S.lang); applyChrome(); renderView(S.view); return; }
  if (d.go) { go(d.go); return; }
  if (d.rtab) { S.rtab = d.rtab; S.ritem = RIBBON.find(r => r.id === d.rtab).items[0].id; history.replaceState(null, '', '#ribbon-' + d.rtab); renderRibbon(); return; }
  if (d.ritem) { S.ritem = d.ritem; renderRibbon(); return; }
  if (d.jump) { const [a, b] = d.jump.split(':'); S.rtab = a; S.ritem = b; history.replaceState(null, '', '#ribbon-' + a); renderRibbon(); return; }
  if (d.lab) { go('lab:' + d.lab); return; }
  if (d.reset) { ({ styles: stInit, captions: capInit, marks: mkInit, indent: () => { S.ind = { fx: 0, ox: 0, size: 16, hard: false }; }, tabs: () => { S.tb.stops = { budget: [], sign: [] }; S.tb.sel = -1; }, table: () => { S.tbl = { rep: false, pad: 0.19, ind: 0 }; }, sections: secInit, track: tkInit })[d.reset](); rerenderLab(); return; }
  /* styles lab */
  if (d.style) { stApply(d.style); $('#stDoc') && $('#stDoc').focus({ preventScroll: true }); return; }
  if (d.mv) { const [id, dir] = d.mv.split(':').map(Number); stMove(id, dir); e.stopPropagation(); rerenderLab(); return; }
  if (d.st === 'num') { S.st.num = !S.st.num; rerenderLab(); return; }
  if (d.st === 'toc') { S.st.toc = stHeads(); rerenderLab(); return; }
  if (d.sel != null && el.closest('#labArea') && S.lab === 'styles') { S.st.sel = +d.sel; rerenderLab(); $('#stDoc') && $('#stDoc').focus({ preventScroll: true }); return; }
  /* captions */
  if (d.cap) { capAct(d.cap); return; }
  if (d.cb) { S.cap.sel = d.cb; rerenderLab(); $('#capDoc') && $('#capDoc').focus({ preventScroll: true }); return; }
  /* marks */
  if (d.mk === 'show') { S.mk.show = !S.mk.show; rerenderLab(); return; }
  if (d.mk === 'undo') { if (S.mk.undo.length) { S.mk.text = S.mk.undo.pop(); S.mk.msg = ''; } rerenderLab(); return; }
  if (d.mk === 'all') { mkReplaceAll(); return; }
  if (d.sp) { const id = S.mk.lastF || 'mkFind'; const key = id === 'mkRepl' ? 'repl' : 'find'; S.mk[key] += d.sp; rerenderLab(); const inp = $('#' + id); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } return; }
  /* indent */
  if (d.ind) { const x = S.ind; const hanging = x.ox > x.fx + 0.01; const left = hanging ? x.fx : x.ox; let by = hanging ? x.ox - x.fx : 0;
    if (d.ind === 't') by = hanging ? by + 1.27 : 1.27; else by = Math.max(0, by - 1.27);
    indSet(left, by > 0.001 ? 'hanging' : 'none', by); indPaint(); return; }
  /* tabs */
  if (d.tbset) { S.tb.set = d.tbset; S.tb.sel = -1; rerenderLab(); return; }
  if (d.tb === 'type') { const o = ['L', 'C', 'R', 'D']; S.tb.type = o[(o.indexOf(S.tb.type) + 1) % 4]; rerenderLab(); return; }
  if (d.tb === 'clear') { S.tb.stops[S.tb.set] = []; S.tb.sel = -1; rerenderLab(); return; }
  /* sections */
  if (d.gap != null) { const i = +d.gap; const b = S.sec.breaks; const k = b.indexOf(i); if (k >= 0) { b.splice(k, 1); delete S.sec.set[i + 1]; } else b.push(i); rerenderLab(); return; }
  if (d.pg != null) { S.sec.sel = +d.pg; rerenderLab(); return; }
  /* track */
  if (d.tk) { tkAct(d.tk); return; }
  if (d.ch != null) { S.tk.cur = +d.ch; rerenderLab(); return; }
  if (d.res != null) { const c = S.tk.comments[+d.res]; c.res = !c.res; S.tk.touched = true; rerenderLab(); return; }
  /* keys */
  if (d.kt === 'reveal') { S.kt.reveal = true; renderKeys(); return; }
  if (d.kt === 'skip') { S.kt.i++; S.kt.state = ''; S.kt.pressed = ''; S.kt.reveal = false; S.kt.streak = 0; renderKeys(); return; }
  /* quiz */
  if (d.qa != null) { S.qz.ans[S.qz.i] = +d.qa; renderQuiz(); return; }
  if (d.qz === 'next') { S.qz.i++; renderQuiz(); return; }
  if (d.qz === 'restart') { S.qz = { i: 0, ans: [] }; renderQuiz(); return; }
  if (d.ck === 'reset') { store.set('check', []); renderCheck(); return; }
});
document.addEventListener('input', e => {
  const el = e.target; const id = el.id;
  if (id === 'rq') { S.rq = el.value; const pos = el.selectionStart; renderRibbon(); const n = $('#rq'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (id === 'mkFind' || id === 'mkRepl') { S.mk[id === 'mkFind' ? 'find' : 'repl'] = el.value; S.mk.lastF = id; S.mk.msg = ''; const pos = el.selectionStart; rerenderLab(); const n = $('#' + id); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (id === 'indLeft' || id === 'indBy' || id === 'indSpec') { const spec = $('#indSpec').value; let by = +$('#indBy').value; if (id === 'indSpec' && spec !== 'none' && by < 0.01) { by = 1.27; $('#indBy').value = by; } indSet(+$('#indLeft').value, spec, spec === 'none' ? 0 : by); indPaint(); return; }
  if (id === 'indSize') { S.ind.size = +el.value; indPaint(); return; }
  if (id === 'tblPad' || id === 'tblInd') { const k = id === 'tblPad' ? 'pad' : 'ind'; S.tbl[k] = +el.value; $('#tblPages').style.setProperty('--' + k, el.value + 'cm'); $(k === 'pad' ? '#oPad' : '#oInd').textContent = (+el.value).toFixed(2) + ' cm'; setDone('table', S.tbl.rep && S.tbl.pad <= 0.1 + 1e-9); return; }
  if (id === 'tkInput') { const pos = el.selectionStart; tkEdit(el.value, S.tk.track); S.tk.touched = true; S.tk.cur = -1; rerenderLab(); const n = $('#tkInput'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (id === 'ktFilter') { S.kt.filter = el.value; const pos = el.selectionStart; renderKeys(); const n = $('#ktFilter'); n.focus(); n.setSelectionRange(pos, pos); return; }
});
document.addEventListener('change', e => {
  const el = e.target; const id = el.id;
  if (id === 'mkCase') { S.mk.cs = el.checked; rerenderLab(); return; }
  if (id === 'indHard') { S.ind.hard = el.checked; rerenderLab(); return; }
  if (id === 'indSpec') return;
  if (id === 'tbLeader') { const s = S.tb.stops[S.tb.set][S.tb.sel]; if (s) s.leader = el.value; rerenderLab(); return; }
  if (id === 'tblRep') { S.tbl.rep = el.checked; rerenderLab(); return; }
  if (id === 'tkView') { S.tk.view = el.value; rerenderLab(); return; }
  if (id === 'secLink' || id === 'secFooter' || id === 'secFmt' || el.name === 'secStart') {
    const { secs } = secCompute(); const s = secs.find(x => S.sec.sel >= x.a && S.sec.sel <= x.z); const c = s.cfg;
    if (id === 'secLink') { c.link = el.checked; if (!el.checked) { const si = secs.indexOf(s); c.footer = si > 0 ? secs[si - 1].on : true; } }
    if (id === 'secFooter') c.footer = el.checked;
    if (id === 'secFmt') c.fmt = el.value;
    if (el.name === 'secStart') c.restart = el.value === 'one';
    rerenderLab(); return;
  }
  if (el.dataset.ci != null) { const st = store.get('check', []); st[+el.dataset.ci] = el.checked; store.set('check', st); renderCheck(); return; }
});
document.addEventListener('focusin', e => { if (e.target.id === 'mkFind' || e.target.id === 'mkRepl') S.mk.lastF = e.target.id; });
document.addEventListener('keydown', e => {
  const id = e.target.id;
  if (id === 'ktPad') { ktKey(e); return; }
  if (S.view === 'labs') {
    if (id === 'stDoc') { stKey(e); return; }
    if (S.lab === 'captions' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { capKey(e); return; }
    if (S.lab === 'marks' && matches(e, K('Ctrl+Shift+8', '___'))) { e.preventDefault(); S.mk.show = !S.mk.show; rerenderLab(); return; }
    if (S.lab === 'marks' && (id === 'mkFind' || id === 'mkRepl') && e.key === 'Enter') { e.preventDefault(); mkReplaceAll(); return; }
    if (S.lab === 'track' && matches(e, K('Ctrl+Shift+E', 'Cmd+Shift+E'))) { e.preventDefault(); tkAct('track'); return; }
    if (S.lab === 'track' && id === 'tkCom' && e.key === 'Enter') { e.preventDefault(); tkAct('com'); return; }
  }
  if (S.view === 'ribbon' && matches(e, 'Alt+Q') && S.os === 'win') { e.preventDefault(); const q = $('#rq'); if (q) q.focus(); }
});
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (S.view === 'labs' && S.lab === 'tabs') tbDraw(); }, 120); });
window.addEventListener('hashchange', route);
applyChrome(); route();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.view === 'labs' && S.lab === 'tabs') tbDraw(); });

</script>
